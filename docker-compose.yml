services:
  db:
    image: postgres:16
    container_name: byp_db
    environment:
      POSTGRES_USER: byp
      POSTGRES_PASSWORD: byp_dev_password
      POSTGRES_DB: byp
    ports:
      - "5432:5432"
    volumes:
      - byp_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  byp_pgdata:
